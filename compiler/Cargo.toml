# The MRT 2.0 compiler frontend.
#
# Deliberately zero external dependencies: a hand-written lexer, parser and
# resolver need none, and a hermetic build keeps `cargo test` usable in CI.
[workspace]
resolver = "2"
members = [
    "crates/mrt-diagnostics",
    "crates/mrt-lexer",
    "crates/mrt-ast",
    "crates/mrt-parser",
    "crates/mrt-resolver",
    "crates/mrt-interp",
    "crates/mrt-net",
    "crates/mrt-ai",
    "crates/mrt-audio",
    "crates/mrt-game",
    "crates/mrt-speaker",
    "crates/mrt-window",
    "crates/mrt-gamepad",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
panic = "abort"
