[package]
name = "mrt-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mrt-check"
path = "src/main.rs"

# Deliberately `mrt-run`, not `mrt`. The bare name belongs to the console
# script the PyPI package installs (`mrt = "mrt.__main__:main"`), and a second
# program answering to it puts two different interpreters on one PATH -- whose
# output wins then depends on PATH order rather than on what anyone asked for.
# Cargo also warns on every build when one source file backs two bin targets.
[[bin]]
name = "mrt-run"
path = "src/run.rs"

# The binary is `mrt-game` and so is the library crate it drives. Deliberate:
# the name people type should say what it does, and `cargo run --bin mrt-game`
# against `cargo test -p mrt-game` is unambiguous to cargo even where it is
# briefly confusing to a reader.
[[bin]]
name = "mrt-game"
path = "src/game.rs"

[dependencies]
mrt-diagnostics = { path = "../crates/mrt-diagnostics" }
mrt-lexer = { path = "../crates/mrt-lexer" }
mrt-ast = { path = "../crates/mrt-ast" }
mrt-parser = { path = "../crates/mrt-parser" }
mrt-resolver = { path = "../crates/mrt-resolver" }
mrt-interp = { path = "../crates/mrt-interp", features = ["window"] }

[lints]
workspace = true
