[package]
name = "mrt-interp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mrt-diagnostics = { path = "../mrt-diagnostics" }
mrt-ast = { path = "../mrt-ast" }
mrt-parser = { path = "../mrt-parser" }
mrt-ai = { path = "../mrt-ai" }
mrt-audio = { path = "../mrt-audio" }
mrt-game = { path = "../mrt-game" }
# Optional, and off by default. The window is the only thing in this
# workspace with a dependency tree, and mrt-interp's is the test suite run
# most often -- so `cargo test -p mrt-interp` stays hermetic and instant, and
# the binary that actually needs to show a window turns the feature on.
mrt-window = { path = "../mrt-window", optional = true }
mrt-speaker = { path = "../mrt-speaker", optional = true }

[features]
window = ["dep:mrt-window"]
audio = ["dep:mrt-speaker"]

[lints]
workspace = true
