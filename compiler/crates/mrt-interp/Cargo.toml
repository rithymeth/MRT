[package]
name = "mrt-interp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mrt-diagnostics = { path = "../mrt-diagnostics" }
mrt-ast = { path = "../mrt-ast" }
mrt-parser = { path = "../mrt-parser" }
mrt-ai = { path = "../mrt-ai" }
mrt-audio = { path = "../mrt-audio" }
mrt-game = { path = "../mrt-game" }
# Optional, and off by default. The window and the speaker are the only
# things in this workspace with dependency trees, and mrt-interp's is the
# test suite run most often -- so `cargo test -p mrt-interp` stays hermetic
# and instant, and the binary that needs hardware turns the features on.
mrt-window = { path = "../mrt-window", optional = true }
mrt-speaker = { path = "../mrt-speaker", optional = true }

[dev-dependencies]
# The audit test alone. The compiler never consults the resolver at run
# time -- that they agree anyway is exactly what is being checked.
mrt-resolver = { path = "../mrt-resolver" }

[features]
window = ["dep:mrt-window"]
audio = ["dep:mrt-speaker"]

[lints]
workspace = true
