[mypy]
python_version = 3.11
warn_unused_configs = True

# MRT is a dynamic-language interpreter; the runtime model is intentionally
# duck-typed through match/case narrowing and Thing-or-None patterns, so
# StrictOptional and similar strictness flags would flag every internal
# dispatch as an error without catching real bugs.  Keep the type checker
# on the structural checks it does well: arg/return types on the public
# builtins and the AST node definitions.
check_untyped_defs = False

# Note: lexer.py carries a chunk of untyped helper functions (tokentype
# classification, scanning helpers).  Forcing check_untyped_defs would
# classify that as errors without improving correctness; leave it off.
