name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (flake8, informational only)
        run: flake8 src --max-line-length=120 --extend-ignore=E203,E501,W503,E302,E305,W391,F403,F405,F821
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v

      - name: Run every bundled example program
        run: |
          for f in examples/*.mrt; do
            echo "--- $f ---"
            mrt "$f"
          done

      # Not a performance gate -- CI timings are too noisy to assert on. This
      # only proves every benchmark still runs and still produces its
      # checksum, so one that quietly stops doing its work is visible.
      - name: Run the benchmarks once as a smoke check
        run: python3 scripts/bench.py --runs 1 --python-only

  playground:
    name: Playground (build, lint, and check parity with the Python interpreter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python package (used by the parity check below)
        run: pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check the Playground's TS interpreter matches the Python interpreter
        run: npm run check:parity

  frontend:
    name: MRT 2.0 compiler (Rust build, tests, and conformance with the Python reference)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python package (the conformance baseline)
        run: pip install -e .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('compiler/**/Cargo.toml', 'compiler/**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --manifest-path compiler/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path compiler/Cargo.toml

      - name: Test
        run: cargo test --manifest-path compiler/Cargo.toml

      # Frontend conformance: the same tokens and the same tree as the
      # reference implementation, rejecting exactly what it rejects, plus a
      # resolver pass whose internal invariants must hold over every program
      # in the corpus.
      - name: Check the Rust frontend against the Python reference frontend
        run: python3 scripts/check-frontend-conformance.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Interpreter conformance: every example and every shared regression
      # case run through both the Python reference and the Rust interpreter,
      # compared byte for byte. Cases that stop on a feature the Rust
      # interpreter does not have yet are ratcheted rather than skipped, so
      # neither a new gap nor a closed one passes unnoticed.
      - name: Check the Rust interpreter against the Python reference interpreter
        run: node scripts/check-interp-conformance.mjs
