name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (flake8, informational only)
        run: flake8 src --max-line-length=120 --extend-ignore=E203,E501,W503,E302,E305,W391,F403,F405,F821
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v

      - name: Run every bundled example program
        run: |
          for f in examples/*.mrt; do
            echo "--- $f ---"
            mrt "$f"
          done
