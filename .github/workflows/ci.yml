name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (flake8, informational only)
        run: flake8 mrt --max-line-length=120 --extend-ignore=E203,E501,W503,E302,E305,W391
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v

      - name: Run every bundled example program
        run: |
          # examples/engine-specific ones (game*, ai*, sound*) call builtins
          # only the Rust engines have and are expected to fail here -- see
          # scripts/engine-specific-examples.txt, the one list this and
          # scripts/parity-cases.mjs both read, so they cannot drift apart.
          mapfile -t skip < <(grep -v '^#' scripts/engine-specific-examples.txt | grep -v '^[[:space:]]*$')
          for f in examples/*.mrt; do
            name=$(basename "$f")
            skip_this=false
            for s in "${skip[@]}"; do
              if [ "$s" = "$name" ]; then skip_this=true; fi
            done
            if [ "$skip_this" = true ]; then
              echo "--- $f (skipped: engine extension) ---"
              continue
            fi
            echo "--- $f ---"
            mrt "$f"
          done

      # Not a performance gate -- CI timings are too noisy to assert on. This
      # only proves every benchmark still runs and still produces its
      # checksum, so one that quietly stops doing its work is visible.
      - name: Run the benchmarks once as a smoke check
        run: python3 scripts/bench.py --runs 1 --python-only

  playground:
    name: Playground (build, lint, and check parity with the Python interpreter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python package (used by the parity check below)
        run: pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check the Playground's TS interpreter matches the Python interpreter
        run: npm run check:parity

  frontend:
    name: MRT 2.0 compiler (Rust build, tests, and conformance with the Python reference)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python package (the conformance baseline)
        run: pip install -e .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # cli's binaries (mrt-check, mrt-run, mrt-game) build mrt-interp with
      # the window, audio and gamepad features on unconditionally (see
      # compiler/cli/Cargo.toml), so even the plain `cargo build` below needs
      # these: alsa-sys links against libasound2 at build time, libudev-sys
      # against libudev the same way for gilrs, and xvfb/libxkbcommon-x11-0
      # are what let scripts/check-window.sh and scripts/check-game-cli.sh
      # open a real window and talk to a (silent, cardless) sound device
      # further down. Nothing here needs an actual controller plugged in --
      # gilrs opens fine with zero gamepads connected, the same as cpal does
      # with no sound card.
      - name: Install system dependencies for the window, audio and gamepad backends
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-x11-0 xvfb

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('compiler/**/Cargo.toml', 'compiler/**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --manifest-path compiler/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path compiler/Cargo.toml

      - name: Test
        run: cargo test --manifest-path compiler/Cargo.toml

      # mrt-interp's window and audio support are optional features (see
      # compiler/crates/mrt-interp/Cargo.toml) precisely so that `cargo test
      # -p mrt-interp` alone stays hermetic; these two runs are what actually
      # exercise the code behind each flag.
      - name: Test with the window feature
        run: cargo test --manifest-path compiler/Cargo.toml -p mrt-interp --features window

      - name: Test with the audio feature
        run: cargo test --manifest-path compiler/Cargo.toml -p mrt-interp --features audio

      - name: Test with the gamepad feature
        run: cargo test --manifest-path compiler/Cargo.toml -p mrt-interp --features gamepad

      # Frontend conformance: the same tokens and the same tree as the
      # reference implementation, rejecting exactly what it rejects, plus a
      # resolver pass whose internal invariants must hold over every program
      # in the corpus.
      - name: Check the Rust frontend against the Python reference frontend
        run: python3 scripts/check-frontend-conformance.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Interpreter conformance: every example and every shared regression
      # case run through both the Python reference and the Rust interpreter,
      # compared byte for byte. Cases that stop on a feature the Rust
      # interpreter does not have yet are ratcheted rather than skipped, so
      # neither a new gap nor a closed one passes unnoticed.
      - name: Check the Rust interpreter against the Python reference interpreter
        run: node scripts/check-interp-conformance.mjs

      # The bytecode VM compiles a subset of MRT so far. Of the cases it does
      # compile, every one must match the reference byte for byte; the rest
      # are ratcheted in scripts/vm-unsupported.json so neither a new gap nor
      # a closed one passes unnoticed.
      - name: Check the bytecode VM against the Python reference interpreter
        run: node scripts/check-vm-conformance.mjs

      # The packager's only real test: every module-system case and every
      # bundled example that imports something, packaged and then run, must
      # behave exactly like the unpackaged original -- on both engines.
      - name: Check that mrt-game package preserves behavior
        run: node scripts/check-package.mjs

      # Opens a real window under Xvfb and presents real frames; see
      # scripts/check-window.sh for why this can't be an ordinary `cargo test`.
      - name: Check that a real window opens and presents frames
        run: sh scripts/check-window.sh

      # Scaffolds a game with `mrt-game new`, checks it, and runs it under
      # Xvfb -- the one check that would notice a builtin the starter game
      # uses getting renamed or changed elsewhere in the workspace.
      - name: Check the mrt-game CLI end to end
        run: sh scripts/check-game-cli.sh
