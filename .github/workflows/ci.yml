name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (flake8, informational only)
        run: flake8 src --max-line-length=120 --extend-ignore=E203,E501,W503,E302,E305,W391,F403,F405,F821
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v

      - name: Run every bundled example program
        run: |
          for f in examples/*.mrt; do
            echo "--- $f ---"
            mrt "$f"
          done

  playground:
    name: Playground (build, lint, and check parity with the Python interpreter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python package (used by the parity check below)
        run: pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check the Playground's TS interpreter matches the Python interpreter
        run: npm run check:parity

  frontend:
    name: MRT 2.0 frontend (Rust build, tests, and conformance with the Python lexer)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python package (the conformance baseline)
        run: pip install -e .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('compiler/**/Cargo.toml', 'compiler/**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --manifest-path compiler/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path compiler/Cargo.toml

      - name: Test
        run: cargo test --manifest-path compiler/Cargo.toml

      # The Rust frontend has no evaluator yet, so it cannot run the 314
      # behavioural tests or the 146 interpreter parity cases. What it can be
      # held to is lexing exactly what the reference implementation lexes,
      # and rejecting exactly what it rejects.
      - name: Check the Rust frontend against the Python reference frontend
        run: python3 scripts/check-frontend-conformance.py
