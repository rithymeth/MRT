[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "mrt-lang"
version = "0.4.0"
description = "The MRT programming language: reference interpreter and CLI"
readme = "README.md"
requires-python = ">=3.11"  # 3.10 reaches end of life in October 2026; kept at 3.11+
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "MRT Team" }]
keywords = ["programming language", "interpreter", "compiler", "mrt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/rithymeth/MRT"
Source = "https://github.com/rithymeth/MRT"
Issues = "https://github.com/rithymeth/MRT/issues"
Documentation = "https://github.com/rithymeth/MRT/blob/main/docs/LANGUAGE_SPEC.md"
Changelog = "https://github.com/rithymeth/MRT/releases"

[project.scripts]
mrt = "mrt.__main__:main"
# The same entry point under a second name, because `mrt` is not reliably
# available on Windows: `C:\Windows\System32\MRT.exe` is Microsoft's
# Malicious Software Removal Tool, filenames there are case-insensitive, and
# System32 precedes Python's Scripts directory on PATH. Typing `mrt` runs the
# malware scanner, which ignores the argument and exits quietly -- so a Windows
# user's first run of this package produces silence and looks broken.
# `mrt` stays for macOS and Linux, where it is fine.
mrt-lang = "mrt.__main__:main"

# Only the interpreter ships. `src/` next door is the Playground's React app
# and the TypeScript interpreter, which are not part of this distribution.
[tool.black]
target-version = ["py311", "py312", "py313"]

[tool.flake8]
max-line-length = 100
ignore = ["F821"]  # false positives on PEP 563 string-annotated dataclass fields (e.g. 'Token')

[tool.setuptools]
packages = ["mrt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
